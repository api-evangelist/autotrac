aid: autotrac
name: AutoTrac
description: >-
  AutoTrac is a Brazilian fleet management and vehicle tracking technology company with over 30 years
  of experience. As the national market leader, AutoTrac provides satellite and cellular fleet tracking
  solutions, real-time telemetry, driver journey management, and management intelligence platforms for
  logistics, agriculture, maritime, and insurance sectors. The company operates its own terrestrial satellite
  communication station and data center for nationwide coverage.
