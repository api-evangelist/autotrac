apis:
  - aid: autotrac:supervisor-web-api
    name: AutoTrac Supervisor Web API
    description: >-
      The AutoTrac Supervisor Web platform provides fleet management capabilities for monitoring vehicle
      locations, managing fleet operations, generating reports, and coordinating driver assignments across
      Brazil. API access enables third-party system integration with Supervisor Web data.
    humanURL: https://www.autotrac.com.br/software/supervisor-jornada-business/
    tags:
      - Fleet Management
      - GPS Tracking
      - Vehicle Monitoring
      - Fleet Operations
    properties:
      - type: Website
        url: https://www.autotrac.com.br/software/supervisor-jornada-business/
  - aid: autotrac:telemetria-api
    name: AutoTrac Telemetria API
    description: >-
      The AutoTrac Telemetria platform provides real-time vehicle telemetry data including speed, fuel
      consumption, engine diagnostics, tire pressure, temperature sensors (for refrigerated cargo), and
      driver behavior metrics. Used for preventive maintenance and operational efficiency.
    humanURL: https://www.autotrac.com.br/software/telemetria-bi/
    tags:
      - Telemetry
      - Vehicle Diagnostics
      - Fuel Management
      - Driver Behavior
    properties:
      - type: Website
        url: https://www.autotrac.com.br/software/telemetria-bi/
  - aid: autotrac:jornada-api
    name: AutoTrac Jornada Driver Journey API
    description: >-
      The AutoTrac Jornada platform manages driver journey logs and compliance with Brazilian driving
      hour regulations, tracking driving time, rest periods, and journey records for long-distance transport
      compliance (Lei do Caminhoneiro).
    humanURL: https://www.autotrac.com.br/solucoes/controle-de-jornada/
    tags:
      - Driver Management
      - Journey Logs
      - Compliance
      - Transportation Regulations
    properties:
      - type: Website
        url: https://www.autotrac.com.br/solucoes/controle-de-jornada/
  - aid: autotrac:integration-api
    name: AutoTrac Serviço API de Integração
    description: >-
      The "Serviço API de integração" is the one product AutoTrac markets as an API. For shippers (embarcadores)
      it feeds a control tower with real-time information on the carriers serving the company — logistics
      and risk-management data plus the telemetry and video-monitoring streams — and for insurers it opens
      AutoTrac's database for underwriting, renewal and claims regulation on shared customers. Access
      is arranged with AutoTrac's sales team; no endpoint, reference, spec or pricing is published.
    humanURL: https://www.autotrac.com.br/produtos-para-voce/embarcadores/
    tags:
      - Fleet Tracking
      - Shipper Integration
      - Insurance Telematics
      - Control Tower
      - Risk Management
    properties:
      - type: Website
        url: https://www.autotrac.com.br/produtos-para-voce/embarcadores/
      - type: Website
        url: https://www.autotrac.com.br/solucoes/solucao-mercado-segurador/
    x-access: >-
      contract-only — credentials (user id, password, token) and server IP allow-listing are issued by
      AutoTrac per customer, as described by third-party integrators Senior Logística (documentacao.senior.com.br)
      and Atua (wiki.atua.com.br); nothing is self-serve.
