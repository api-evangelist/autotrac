  - type: Features
    data:
      - name: Proprietary Satellite Communication
        description: >-
          AutoTrac operates its own terrestrial satellite communication station and integrated data center,
          providing coverage in areas with limited cellular connectivity across Brazil.
      - name: Real-Time Vehicle Telemetry
        description: >-
          Real-time monitoring of vehicle parameters including location, speed, fuel consumption, engine
          diagnostics, and cargo temperature for refrigerated transport.
      - name: Driver Journey Management
        description: >-
          Jornada platform for tracking driver hours, rest periods, and journey compliance with Brazilian
          transportation regulations.
      - name: Fleet Intelligence Reporting
        description: >-
          Informacoes Gerenciais business intelligence dashboards for fleet performance analytics, cost
          analysis, and operational reporting.
      - name: Agricultural Equipment Tracking
        description: >-
          Specialized tracking solutions for agricultural machinery including harvesters, tractors, and
          implements with field operation monitoring.
  - type: UseCases
    data:
      - name: Long-Distance Logistics Tracking
        description: >-
          Track trucks and cargo across Brazil using satellite and cellular communication for nationwide
          visibility of logistics operations.
      - name: Refrigerated Cargo Monitoring
        description: >-
          Monitor temperature-controlled cargo transport with real-time telemetry alerts for temperature
          deviations in refrigerated vehicles.
      - name: Driver Compliance Management
        description: >-
          Ensure compliance with Brazilian driver hour regulations by tracking journey logs and rest periods
          automatically via Jornada.
      - name: Agricultural Fleet Management
        description: >-
          Track agricultural equipment, monitor field operations, and manage harvest logistics for agribusiness
          operations.
      - name: Insurance Telematics
        description: >-
          Provide vehicle behavior and location data to insurance companies for usage-based insurance
          and stolen vehicle recovery programs.
  - type: Integrations
    data:
      - name: TMS Systems
        description: >-
          Integration with transportation management systems for freight dispatch, route optimization,
          and delivery confirmation workflows.
      - name: ERP Systems
        description: >-
          Connect AutoTrac fleet data with ERP systems (SAP, TOTVS) for fleet cost accounting, maintenance
          scheduling, and asset management.
      - name: Insurance Platforms
        description: >-
          API integration with insurance carriers for vehicle recovery, claims verification, and telematics-based
          premium calculation.
